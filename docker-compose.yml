version: '3.8'

services:
  # ── MongoDB Database ─────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: healthbridge-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=healthbridge

  # ── Backend API Server ───────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: healthbridge-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/healthbridge
      - CLIENT_URL=http://localhost:80
      - JWT_ACCESS_SECRET=healthbridge_production_jwt_access_secret_super_secure_key_1234567890
      - JWT_REFRESH_SECRET=healthbridge_production_jwt_refresh_secret_super_secure_key_1234567890
      - COOKIE_SECRET=healthbridge_production_cookie_secret_super_secure_key_1234567890
    depends_on:
      - mongodb

  # ── Frontend Web App ─────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: healthbridge-client
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server

volumes:
  mongo_data:
